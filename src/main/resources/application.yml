server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        name: PORTFOLIO_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
spring:
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://127.0.0.1:5555/portfolio}}
    username: ${DB_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD:password}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs
portfolio:
  seed-demo: ${SEED_DEMO:true}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin1234567890}
  media:
    directory: ${MEDIA_ROOT:${MEDIA_DIRECTORY:./uploads}}
