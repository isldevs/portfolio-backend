name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: portfolio_test
          # Ephemeral, isolated CI service only; never a deployment credential.
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/portfolio_test
      DB_USERNAME: portfolio_test
      DB_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test bootJar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: build/reports/tests/test
